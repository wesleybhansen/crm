services:
  vault-permissions:
    image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
    user: "0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R vault:vault /vault/data /vault/logs"]
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    restart: "no"

  vault:
    image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
    container_name: launchos-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    depends_on:
      vault-permissions:
        condition: service_completed_successfully
    command: ["server"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./ops/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - launchos-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: launchos-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ATTACHMENTS_PARTITION_LANDING_PAGE_IMAGES_ROOT: /app/apps/mercato/storage/attachments/landingPageImages
      GTM_MAILBOX_QUEUE_STRATEGY: async
      QUEUE_REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_prod_2026}@postgres:5432/${POSTGRES_DB:-crm}
    working_dir: /app/apps/mercato
    command: ["sh", "-c", "cp .mercato/next/standalone/apps/mercato/server.js .mercato/next/standalone/apps/mercato/server.cjs && node .mercato/next/standalone/apps/mercato/server.cjs"]
    ports:
      # Preserve host-local cron/health access without exposing a plaintext
      # path around the nginx TLS and security-header boundary.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/apps/mercato/uploads
      - attachments_storage:/app/apps/mercato/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - launchos-network

  gtm-mailbox-worker:
    image: open-mercato-app
    container_name: launchos-gtm-mailbox-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      QUEUE_STRATEGY: async
      QUEUE_REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_prod_2026}@postgres:5432/${POSTGRES_DB:-crm}
    working_dir: /app/apps/mercato
    command: ["node", "/app/packages/cli/bin/mercato", "queue", "worker", "gtm-mailbox-ingest", "--concurrency=1"]
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - launchos-network

  mcp:
    # External MCP HTTPS endpoint (SPEC-062 Phase 3). Runs the same image
    # as `app` but swaps the command to the MCP streamable-HTTP server.
    # Nginx fronts this service at /mcp; no host port exposure.
    image: open-mercato-app
    container_name: launchos-mcp
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_prod_2026}@postgres:5432/${POSTGRES_DB:-crm}
    working_dir: /app/apps/mercato
    command: ["node", "/app/packages/cli/bin/mercato", "ai_assistant", "mcp:serve-http", "--port", "3001"]
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - launchos-network

  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: launchos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_prod_2026}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup-tables.sql:/docker-entrypoint-initdb.d/setup-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - launchos-network

  redis:
    image: redis:7-alpine
    container_name: launchos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - launchos-network

  nginx:
    image: nginx:alpine
    container_name: launchos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - launchos-network

  certbot:
    image: certbot/certbot
    container_name: launchos-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    name: launchos-postgres-data
  uploads_data:
    name: launchos-uploads-data
  vault_data:
    name: launchos-vault-data
  vault_logs:
    name: launchos-vault-logs
  attachments_storage:
    name: launchos-attachments-storage
  redis_data:
    name: launchos-redis-data

networks:
  launchos-network:
    name: launchos-network
    driver: bridge
