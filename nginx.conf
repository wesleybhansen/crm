map $uri $crm_x_frame_options {
    ~^/api/(forms|surveys)/public/[a-z0-9-]+/?$ "";
    default "DENY";
}

map $host $crm_hsts {
    hostnames;
    default "";
    .noliai.com "max-age=31536000";
}

server {
    listen 80;
    server_name crm.noliai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://crm.noliai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name crm.noliai.com;

    ssl_certificate /etc/letsencrypt/live/crm.noliai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.noliai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Normalize HSTS at the TLS edge, including nginx-generated auth failures,
    # for Noli-owned hosts only. This virtual host also serves customer-owned
    # landing-page domains, whose future HTTP policy Noli must not constrain.
    add_header Strict-Transport-Security $crm_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options $crm_x_frame_options always;
    # Report-only CSP (2026-09-08): observe, then enforce. Violations post to the hub collector.
    # Generated from crmContentSecurityPolicy() in apps/mercato/src/lib/security-headers.ts;
    # a unit test fails if the two drift. Change it there first, then paste it here.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://clerk.noliai.com https://js.stripe.com https://*.js.stripe.com https://challenges.cloudflare.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com https://api.fontshare.com; connect-src 'self' https://*.noliai.com wss://crm.noliai.com https://api.stripe.com https://*.posthog.com https://clerk-telemetry.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://challenges.cloudflare.com https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com; media-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; report-uri https://app.noliai.com/api/csp-report" always;

    # External MCP (Model Context Protocol) streamable-HTTP endpoint.
    # Routed to the dedicated `mcp` container on port 3001. The MCP server
    # enforces x-api-key itself, and we reject empty keys at the edge to
    # avoid pointless upstream hits.
    location /mcp {
        if ($http_x_api_key = "") {
            return 401 '{"error":"x-api-key header required"}';
        }

        proxy_pass http://mcp:3001;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Streamable HTTP / SSE: keep sockets open and don't buffer
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    client_max_body_size 20M;
}
